<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tides.ke</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #ffd6e8, #d8f3ff, #e6d9ff);
      color: #333;
    }

    .container {
      padding: 40px 25px;
      max-width: 600px;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 48px;
      margin: 0;
      color: #222;
    }

    h2 {
      font-size: 28px;
      margin: 15px 0;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .coming-soon {
      margin-top: 30px;
      padding: 15px 25px;
      border-radius: 30px;
      background: white;
      display: inline-block;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">🌊</div>

    <h1>Tides.ke</h1>

    <h2>Something exciting is coming...</h2>

    <p>
      Your next unforgettable experience starts here.
      Stay tuned for upcoming events, tickets and more!
    </p>

    <div class="coming-soon">
      ✨ COMING SOON ✨
    </div>
  </div>
</body>
</html>
